[project]
name = "thesis-defense"
version = "0.1.0"
description = "Thesis defense slides built with Manim Slides"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "manim>=0.18",
    "manim-slides[manim]>=5.1",
    "pyqt6>=6.11.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
ignore = ["F403", "F405"]
